# Cloudflare Pages config - only needed for the cross-device cloud save
# feature (functions/api/save/), which needs a KV namespace binding that
# `wrangler pages deploy` has no other way to pick up without this file.
# The deploy command itself is unchanged (.github/workflows/deploy.yml still
# runs `wrangler pages deploy dist ...`); wrangler reads this automatically
# from the repo root.
#
# The SAVES namespace below was created 2026-09-09 via
# `wrangler kv namespace create SAVES` against the same Cloudflare account
# that owns the emoji-rpg Pages project (confirmed via `wrangler pages
# project list` before creating it).
name = "emoji-rpg"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-09"

[[kv_namespaces]]
binding = "SAVES"
id = "b8b1cdef39364bd09c03ff64ace10198"

# Two secrets are required for functions/api/save/email/* (the email-OTP
# cloud save feature) and must be set via `wrangler pages secret put
# <NAME>` (or the Cloudflare Pages dashboard's environment variables,
# marked "Secret" not "Plaintext") - NEVER added above as a [vars] entry,
# which is plaintext and committed to this file:
#   RESEND_API_KEY          - from a Resend (resend.com) account
#   EMAIL_RATE_LIMIT_SECRET - any random string; only used as an HMAC key
# Resend also requires DNS domain verification before it will deliver
# mail — see the same "Human prerequisite" section for the details.
# See docs/superpowers/specs/2026-09-14-email-otp-cloud-save-design.md's
# "Human prerequisite" section.
